apiVersion: v1
kind: ConfigMap
metadata:
  name: usms-enrolment-conf
  namespace: usms
  labels:
    app: usms-enrolment
data:
  default.conf.template: |
    server {
      listen 80;
      location /healthz { add_header Content-Type text/plain; return 200 "ok\n"; }
      location / {
        add_header Content-Type application/json;
        return 200 '{"service": "usms-enrolment", "pod": "${POD_NAME}", "campus":"${APP_CAMPUS}", "version": "${APP_VERSION}"}\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usms-enrolment
  namespace: usms
  labels:
    app: usms-enrolment
    project: usms
    tier: app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: usms-enrolment
  template:
    metadata:
      labels:
        app: usms-enrolment
        project: usms
        tier: app
    spec:
      containers:
      - name: enrolment
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 80
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: usms-app-config
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/templates
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: conf
        configMap:
          name: usms-enrolment-conf
---
apiVersion: v1
kind: Service
metadata:
  name: usms-enrolment
  namespace: usms
  labels:
    app: usms-enrolment
spec:
  type: ClusterIP
  selector:
    app: usms-enrolment
  ports:
  - name: http
    port: 80
    targetPort: http
