version: 0.2
env:
  variables:
    USMS_PROJECT: USMS
    USMS_SERVICE: enrolment
phases:
  install:
    commands:
    - 'echo "=== install: toolchain check ==="'
    - python3 --version
    - docker --version || true
  pre_build:
    commands:
    - 'echo "=== pre_build: unit tests ==="'
    - test -f VERSION && test -f src/index.html && test -f config/service.json
    - "if [ -n \"${IMAGE_REPO_URI:-}\" ]; then REGISTRY_HOST=\"${IMAGE_REPO_URI%%/*}\"\
      ; echo \"logging in to ${REGISTRY_HOST}\"; aws ecr get-login-password --region\
      \ \"${AWS_REGION_COURSE:-us-east-1}\" | docker login --username AWS --password-stdin\
      \ \"${REGISTRY_HOST}\"; else echo \"IMAGE_REPO_URI is empty \u2014 skipping\
      \ registry login\"; fi"
  build:
    commands:
    - 'echo "=== build: render portal and build image ==="'
    - mkdir -p dist
    - cp -f src/index.html src/healthz.html config/service.json dist/
    - IMAGE_TAG=$(tr -d "[:space:]" < VERSION)
    - export IMAGE_TAG
    - if [ -n "${IMAGE_REPO_URI:-}" ]; then docker build -t "usms-enrolment:${IMAGE_TAG}"
      . && docker tag "usms-enrolment:${IMAGE_TAG}" "${IMAGE_REPO_URI}:${IMAGE_TAG}"
      && docker push "${IMAGE_REPO_URI}:${IMAGE_TAG}"; fi
  post_build:
    commands:
    - 'echo "=== post_build: emit imagedefinitions.json ==="'
    - IMAGE_TAG=$(tr -d "[:space:]" < VERSION)
    - if [ -n "${IMAGE_REPO_URI:-}" ]; then IMAGE_URI="${IMAGE_REPO_URI}:${IMAGE_TAG}";
      else IMAGE_URI="usms-enrolment:${IMAGE_TAG}"; fi; printf '[{"name":"enrolment-api","imageUri":"%s"}]\n'
      "${IMAGE_URI}" > imagedefinitions.json
    - cp -f imagedefinitions.json dist/imagedefinitions.json
    - cat imagedefinitions.json
    - test -f dist/index.html && test -f dist/service.json && test -f imagedefinitions.json
artifacts:
  files:
  - imagedefinitions.json
  - dist/**/*
  discard-paths: 'no'
